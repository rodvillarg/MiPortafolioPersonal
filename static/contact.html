<main>
    <section>
        <h2>Formulario de contacto</h2>

        <form action="#" method="post" netlify>
        <label for="nombre">Nombre completo:</label>
            <input type="text" id="nombre" name="nombre" placeholder="Ej. Juan Pérez">

            <label for="email">Correo electrónico:</label>
            <input type="email" id="email" name="email" placeholder="ejemplo@gmail.com" required pattern="^[^@\s]+@[^@\s]+\.[^@\s]+$">

            <label for="telefono">Teléfono:</label>
            <input type="tel" id="telefono" name="telefono" placeholder="10 dígitos" pattern="[0-9]{10}">

            <label for="edad">Edad:</label>
            <input type="number" id="edad" name="edad" min="1" max="100" required>

            <label for="fecha">Fecha:</label>
            <input type="date" id="fecha" name="fecha" required>

            <label for="motivo">Motivo de contacto:</label>
            <select name="motivo" id="motivo">
                <option value="">Seleccione una opción</option>
                <option value="trabajo">Trabajo</option>
                <option value="proyecto">Proyecto</option>
                <option value="asesorias">Asesorías</option>
            </select>

            <label>¿Cómo te gustaría que te contacte?</label>
            <br>
            <input type="radio" id="contacto-correo" name="metodo-contacto" value="correo">
            <label for="contacto-correo">Correo</label>
            <input type="radio" id="contacto-wha" name="metodo-contacto" value="whatsapp">
            <label for="contacto-wha">WhatsApp</label>

            <label for="mensaje">Mensaje:</label>
            <textarea id="mensaje" name="mensaje" rows="4" cols="40" placeholder="Escribe tu mensaje aquí."></textarea>

            <br><br>
            <div style="display: flex; gap: 10px; margin-top: 15px;">
                <button type="submit">Enviar</button>
                <button type="reset">Limpiar</button>
            </div>
        </form>
    </section>
</main>
